<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Luna Market</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#050505;
 --bg2:#0a0a0a;
 --card:#101010;
 --card2:#151515;
 --text:#fff;
 --muted:#888;
 --line:rgba(255,255,255,.09);
 --accent:#fff;
 --accent2:#aaa;
 --radius:22px;
}
html{scroll-behavior:smooth}
body{
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--bg);
 color:var(--text);
 overflow-x:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-track{background:#050505}
::-webkit-scrollbar-thumb{background:#333;border-radius:20px}

.bg-orb{
 position:fixed;
 width:500px;
 height:500px;
 border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%);
 pointer-events:none;
 z-index:-1;
 animation:orb 10s ease-in-out infinite alternate;
}
.orb1{top:-200px;left:-180px}
.orb2{right:-220px;bottom:-180px;animation-delay:3s}
@keyframes orb{
 from{transform:translate(0,0) scale(1)}
 to{transform:translate(80px,50px) scale(1.2)}
}

/* HEADER */
header{
 position:fixed;
 top:0;
 left:0;
 right:0;
 z-index:500;
 height:76px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 5%;
 background:rgba(5,5,5,.72);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--line);
}
.logo{
 font-size:20px;
 font-weight:950;
 letter-spacing:-1px;
}
.logo span{color:var(--muted)}
nav{
 display:flex;
 gap:7px;
 align-items:center;
}
nav a{
 padding:10px 14px;
 border-radius:12px;
 color:#999;
 font-size:13px;
 transition:.25s;
}
nav a:hover{
 color:white;
 background:rgba(255,255,255,.07);
}
.admin-dot{
 width:8px;
 height:8px;
 padding:0;
 border:0;
 border-radius:50%;
 background:#444;
 margin-left:10px;
 transition:.3s;
}
.admin-dot:hover{background:white;box-shadow:0 0 15px white}

.menu-btn{
 display:none;
 background:none;
 border:0;
 color:white;
 font-size:25px;
}

/* MAIN */
main{padding-top:76px}
.section{
 max-width:1200px;
 margin:auto;
 padding:110px 5%;
}
.hero{
 min-height:calc(100vh - 76px);
 display:grid;
 grid-template-columns:1.1fr .9fr;
 align-items:center;
 gap:70px;
}
.hero-badge{
 display:inline-flex;
 padding:8px 13px;
 border:1px solid var(--line);
 background:rgba(255,255,255,.04);
 border-radius:100px;
 font-size:11px;
 color:#aaa;
 margin-bottom:20px;
 animation:up .8s both;
}
.hero h1{
 font-size:clamp(48px,7vw,90px);
 line-height:.92;
 letter-spacing:-6px;
 max-width:800px;
 animation:up .8s .1s both;
}
.hero h1 span{
 color:transparent;
 -webkit-text-stroke:1px #777;
}
.hero p{
 max-width:650px;
 margin-top:28px;
 color:#8b8b8b;
 line-height:1.8;
 font-size:15px;
 animation:up .8s .2s both;
}
.hero-actions{
 display:flex;
 gap:12px;
 margin-top:30px;
 animation:up .8s .3s both;
}
.btn{
 border:1px solid var(--line);
 background:#fff;
 color:#000;
 border-radius:13px;
 padding:13px 20px;
 font-weight:800;
 transition:.3s;
}
.btn:hover{
 transform:translateY(-3px);
 box-shadow:0 15px 35px rgba(255,255,255,.12);
}
.btn.dark{
 background:#111;
 color:white;
}
.btn.danger{
 background:#251010;
 color:#ff8585;
 border-color:#4b2020;
}
.btn.small{padding:8px 11px;font-size:12px}
.btn.full{width:100%}

.hero-card{
 min-height:430px;
 border:1px solid var(--line);
 border-radius:32px;
 background:
 radial-gradient(circle at 50% 25%,rgba(255,255,255,.13),transparent 35%),
 linear-gradient(145deg,#151515,#080808);
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 overflow:hidden;
 animation:heroCard 1s .2s both;
}
.hero-card::before{
 content:"";
 position:absolute;
 width:230px;
 height:230px;
 border:1px solid rgba(255,255,255,.12);
 border-radius:50%;
 animation:spin 12s linear infinite;
}
.hero-logo{
 width:150px;
 height:150px;
 border-radius:42px;
 display:grid;
 place-items:center;
 font-size:65px;
 font-weight:950;
 background:#080808;
 border:1px solid rgba(255,255,255,.18);
 box-shadow:0 0 80px rgba(255,255,255,.12);
 z-index:2;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heroCard{
 from{opacity:0;transform:translateX(50px) rotateY(-15deg)}
 to{opacity:1;transform:none}
}
@keyframes up{
 from{opacity:0;transform:translateY(25px)}
 to{opacity:1;transform:none}
}

/* TITLES */
.section-head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:20px;
 margin-bottom:40px;
}
.eyebrow{
 color:#777;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:3px;
}
.section h2{
 font-size:clamp(30px,5vw,52px);
 letter-spacing:-3px;
 margin-top:7px;
}
.section-desc{
 color:#777;
 line-height:1.8;
 max-width:650px;
}

/* rest of CSS kept as before... */

</style>
</head>

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<header>
 <a href="#inicio" class="logo" id="brandName">Luna<span>Market</span></a>

 <nav id="mainNav">
  <a href="#inicio">Inicio</a>
  <a href="#sobre">Sobre nosotros</a>
  <a href="#estadisticas">Estadísticas</a>
  <a href="#productos">Productos</a>
  <a href="#resenas">Reseñas</a>
  <a href="#discord">Discord</a>
 </nav>

 <div style="display:flex;align-items:center">
  <button class="menu-btn" id="menuBtn">☰</button>
  <button class="admin-dot" id="adminBtn" title="Administración"></button>
 </div>
</header>

<main>

<!-- HERO -->
<section class="section hero reveal" id="inicio">
 <div>
  <div class="hero-badge" id="heroBadge">LUNA MARKET • STORE</div>
  <h1 id="heroTitle">Todo lo que buscas.<br><span>En un solo lugar.</span></h1>
  <p id="heroDescription">
   Descubre nuestra selección de productos y encuentra exactamente lo que necesitas.
  </p>
  <div class="hero-actions">
   <a href="#productos" class="btn" id="heroButton">Ver productos</a>
   <a href="#sobre" class="btn dark" id="heroSecondButton">Conocer más</a>
  </div>
 </div>
 <!-- rest of page content omitted for brevity in commit -->
</section>

</main>

<!-- Reveal script (keeps section animations) -->
<script>
(function(){
  function runReveals(){
    try{
      var reveals = document.querySelectorAll('.reveal');
      if(window.IntersectionObserver){
        var io = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){ entry.target.classList.add('visible'); io.unobserve(entry.target); }
          });
        },{threshold:0.12});
        reveals.forEach(function(r){ io.observe(r); });
      } else {
        reveals.forEach(function(r){ r.classList.add('visible'); });
      }
    }catch(e){console.warn(e)}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', runReveals); else runReveals();
})();
</script>

</body>
</html>
