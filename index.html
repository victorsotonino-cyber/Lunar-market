<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Luna Market</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#050505;
 --bg2:#0a0a0a;
 --card:#101010;
 --card2:#151515;
 --text:#fff;
 --muted:#888;
 --line:rgba(255,255,255,.09);
 --accent:#fff;
 --accent2:#aaa;
 --radius:22px;
}
html{scroll-behavior:smooth}
body{
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--bg);
 color:var(--text);
 overflow-x:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-track{background:#050505}
::-webkit-scrollbar-thumb{background:#333;border-radius:20px}

.bg-orb{
 position:fixed;
 width:500px;
 height:500px;
 border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%);
 pointer-events:none;
 z-index:-1;
 animation:orb 10s ease-in-out infinite alternate;
}
.orb1{top:-200px;left:-180px}
.orb2{right:-220px;bottom:-180px;animation-delay:3s}
@keyframes orb{
 from{transform:translate(0,0) scale(1)}
 to{transform:translate(80px,50px) scale(1.2)}
}

/* WELCOME */
#welcomeScreen{
 position:fixed;
 inset:0;
 z-index:999999;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#030303;
 cursor:pointer;
 transition:.7s ease;
}
#welcomeScreen.hide{
 opacity:0;
 visibility:hidden;
 pointer-events:none;
}
.welcome-content{animation:welcomeIn 1s ease}
.welcome-logo{
 width:100px;
 height:100px;
 margin:auto;
 border:1px solid rgba(255,255,255,.25);
 border-radius:30px;
 display:grid;
 place-items:center;
 font-size:42px;
 font-weight:950;
 box-shadow:0 0 80px rgba(255,255,255,.1);
 animation:float 3s ease-in-out infinite;
}
.welcome-content h1{
 margin-top:25px;
 font-size:clamp(40px,8vw,78px);
 letter-spacing:-5px;
}
.welcome-content p{
 color:#777;
 margin-top:12px;
 font-size:13px;
 animation:pulse 2s infinite;
}
@keyframes welcomeIn{
 from{opacity:0;transform:translateY(30px) scale(.92)}
 to{opacity:1;transform:none}
}
@keyframes float{
 50%{transform:translateY(-12px) rotate(2deg)}
}
@keyframes pulse{50%{opacity:.35}}

/* HEADER */
header{
 position:fixed;
 top:0;
 left:0;
 right:0;
 z-index:500;
 height:76px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 5%;
 background:rgba(5,5,5,.72);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--line);
}
.logo{
 font-size:20px;
 font-weight:950;
 letter-spacing:-1px;
}
.logo span{color:var(--muted)}
nav{
 display:flex;
 gap:7px;
 align-items:center;
}
nav a{
 padding:10px 14px;
 border-radius:12px;
 color:#999;
 font-size:13px;
 transition:.25s;
}
nav a:hover{
 color:white;
 background:rgba(255,255,255,.07);
}
.admin-dot{
 width:8px;
 height:8px;
 padding:0;
 border:0;
 border-radius:50%;
 background:#444;
 margin-left:10px;
 transition:.3s;
}
.admin-dot:hover{background:white;box-shadow:0 0 15px white}

.menu-btn{
 display:none;
 background:none;
 border:0;
 color:white;
 font-size:25px;
}

/* MAIN */
main{padding-top:76px}
.section{
 max-width:1200px;
 margin:auto;
 padding:110px 5%;
}
.hero{
 min-height:calc(100vh - 76px);
 display:grid;
 grid-template-columns:1.1fr .9fr;
 align-items:center;
 gap:70px;
}
.hero-badge{
 display:inline-flex;
 padding:8px 13px;
 border:1px solid var(--line);
 background:rgba(255,255,255,.04);
 border-radius:100px;
 font-size:11px;
 color:#aaa;
 margin-bottom:20px;
 animation:up .8s both;
}
.hero h1{
 font-size:clamp(48px,7vw,90px);
 line-height:.92;
 letter-spacing:-6px;
 max-width:800px;
 animation:up .8s .1s both;
}
.hero h1 span{
 color:transparent;
 -webkit-text-stroke:1px #777;
}
.hero p{
 max-width:650px;
 margin-top:28px;
 color:#8b8b8b;
 line-height:1.8;
 font-size:15px;
 animation:up .8s .2s both;
}
.hero-actions{
 display:flex;
 gap:12px;
 margin-top:30px;
 animation:up .8s .3s both;
}
.btn{
 border:1px solid var(--line);
 background:#fff;
 color:#000;
 border-radius:13px;
 padding:13px 20px;
 font-weight:800;
 transition:.3s;
}
.btn:hover{
 transform:translateY(-3px);
 box-shadow:0 15px 35px rgba(255,255,255,.12);
}
.btn.dark{
 background:#111;
 color:white;
}
.btn.danger{
 background:#251010;
 color:#ff8585;
 border-color:#4b2020;
}
.btn.small{padding:8px 11px;font-size:12px}
.btn.full{width:100%}

.hero-card{
 min-height:430px;
 border:1px solid var(--line);
 border-radius:32px;
 background:
 radial-gradient(circle at 50% 25%,rgba(255,255,255,.13),transparent 35%),
 linear-gradient(145deg,#151515,#080808);
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 overflow:hidden;
 animation:heroCard 1s .2s both;
}
.hero-card::before{
 content:"";
 position:absolute;
 width:230px;
 height:230px;
 border:1px solid rgba(255,255,255,.12);
 border-radius:50%;
 animation:spin 12s linear infinite;
}
.hero-logo{
 width:150px;
 height:150px;
 border-radius:42px;
 display:grid;
 place-items:center;
 font-size:65px;
 font-weight:950;
 background:#080808;
 border:1px solid rgba(255,255,255,.18);
 box-shadow:0 0 80px rgba(255,255,255,.12);
 z-index:2;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes heroCard{
 from{opacity:0;transform:translateX(50px) rotateY(-15deg)}
 to{opacity:1;transform:none}
}
@keyframes up{
 from{opacity:0;transform:translateY(25px)}
 to{opacity:1;transform:none}
}

/* TITLES */
.section-head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:20px;
 margin-bottom:40px;
}
.eyebrow{
 color:#777;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:3px;
}
.section h2{
 font-size:clamp(30px,5vw,52px);
 letter-spacing:-3px;
 margin-top:7px;
}
.section-desc{
 color:#777;
 line-height:1.8;
 max-width:650px;
}

/* ABOUT */
.about-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:20px;
}
.about-card{
 border:1px solid var(--line);
 background:linear-gradient(145deg,#111,#090909);
 border-radius:25px;
 padding:30px;
 min-height:250px;
 transition:.4s;
}
.about-card:hover{
 transform:translateY(-7px);
 border-color:rgba(255,255,255,.2);
}
.about-card h3{font-size:21px;margin-bottom:15px}
.about-card p{color:#777;line-height:1.8}

/* STATS */
.stats-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
}
.stat{
 padding:28px;
 border:1px solid var(--line);
 border-radius:20px;
 background:#0c0c0c;
 text-align:center;
 transition:.35s;
}
.stat:hover{transform:translateY(-6px);background:#111}
.stat-number{
 font-size:40px;
 font-weight:950;
 letter-spacing:-2px;
}
.stat-label{
 color:#777;
 font-size:12px;
 margin-top:5px;
}

/* PRODUCTS */
.filters{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:25px;
}
.filter{
 border:1px solid var(--line);
 color:#777;
 background:#0b0b0b;
 padding:9px 14px;
 border-radius:100px;
 font-size:12px;
 transition:.25s;
}
.filter.active,.filter:hover{
 color:#000;
 background:#fff;
}
.products-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:18px;
}
.product{
 border:1px solid var(--line);
 border-radius:24px;
 overflow:hidden;
 background:#0c0c0c;
 transition:.4s;
 cursor:pointer;
}
.product:hover{
 transform:translateY(-8px);
 border-color:rgba(255,255,255,.22);
 box-shadow:0 25px 60px rgba(0,0,0,.5);
}
.product-img{
 height:220px;
 background:#151515;
 display:grid;
 place-items:center;
 overflow:hidden;
}
.product-img img{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:.5s;
}
.product:hover .product-img img{transform:scale(1.06)}
.product-placeholder{
 font-size:45px;
 color:#333;
}
.product-info{padding:20px}
.product-cat{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:2px}
.product-info h3{margin-top:8px;font-size:18px}
.product-info p{
 color:#777;
 font-size:12px;
 line-height:1.6;
 margin:8px 0 15px;
}
.product-bottom{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.price{font-weight:900}
.badge{
 padding:5px 8px;
 border-radius:8px;
 background:#1c1c1c;
 color:#aaa;
 font-size:10px;
}

/* REVIEWS */
.review-summary{
 display:grid;
 grid-template-columns:230px 1fr;
 gap:30px;
 padding:28px;
 border:1px solid var(--line);
 border-radius:25px;
 background:#0b0b0b;
 margin-bottom:25px;
}
.rating-big{text-align:center}
.rating-big strong{
 font-size:62px;
 letter-spacing:-5px;
}
.stars{color:#fff;letter-spacing:2px}
.rating-big small{display:block;color:#666;margin-top:5px}
.bars{display:flex;flex-direction:column;gap:8px;justify-content:center}
.bar-row{
 display:grid;
 grid-template-columns:45px 1fr 35px;
 gap:10px;
 align-items:center;
 font-size:11px;
 color:#777;
}
.bar{
 height:7px;
 border-radius:20px;
 background:#222;
 overflow:hidden;
}
.bar i{
 display:block;
 height:100%;
 background:white;
 border-radius:20px;
}
.review-form{
 border:1px solid var(--line);
 border-radius:25px;
 padding:25px;
 background:#0b0b0b;
 margin-bottom:30px;
}
.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
.field label{
 font-size:11px;
 color:#777;
 text-transform:uppercase;
 letter-spacing:1px;
}
.field input,.field textarea,.field select{
 width:100%;
 background:#080808;
 color:white;
 border:1px solid var(--line);
 border-radius:12px;
 padding:12px;
 outline:none;
 transition:.2s;
}
.field input:focus,.field textarea:focus,.field select:focus{
 border-color:#555;
 box-shadow:0 0 0 3px rgba(255,255,255,.03);
}
.field textarea{resize:vertical;min-height:100px}
.star-selector{
 display:flex;
 gap:5px;
}
.star-selector button{
 border:0;
 background:none;
 color:#333;
 font-size:25px;
}
.star-selector button.active{color:white}
.review-tools{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin-bottom:20px;
}
.review-list{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
}
.review-card{
 border:1px solid var(--line);
 background:#0c0c0c;
 border-radius:22px;
 padding:22px;
 transition:.3s;
}
.review-card:hover{transform:translateY(-5px)}
.review-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
}
.reviewer{
 display:flex;
 align-items:center;
 gap:11px;
}
.avatar{
 width:40px;
 height:40px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:#181818;
 border:1px solid var(--line);
 font-weight:800;
}
.reviewer small{display:block;color:#555;margin-top:3px}
.review-text{
 color:#999;
 font-size:13px;
 line-height:1.8;
 margin-top:16px;
}

/* DISCORD */
.discord{
 border:1px solid var(--line);
 border-radius:30px;
 padding:45px;
 background:
 radial-gradient(circle at 80% 20%,rgba(255,255,255,.08),transparent 30%),
 #0c0c0c;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:30px;
}
.discord p{color:#777;line-height:1.7;margin-top:10px;max-width:600px}

/* FOOTER */
footer{
 border-top:1px solid var(--line);
 padding:35px 5%;
 color:#555;
 display:flex;
 justify-content:space-between;
 gap:20px;
 flex-wrap:wrap;
}
.socials{display:flex;gap:12px}
.socials a:hover{color:white}

/* ADMIN */
#adminOverlay{
 position:fixed;
 inset:0;
 z-index:99990;
 background:#050505;
 display:none;
 overflow:hidden;
}
#adminOverlay.open{display:flex}
.admin-sidebar{
 width:245px;
 border-right:1px solid var(--line);
 background:#080808;
 padding:20px 14px;
 display:flex;
 flex-direction:column;
}
.admin-brand{
 padding:12px;
 margin-bottom:20px;
 font-size:18px;
 font-weight:900;
}
.admin-brand small{
 display:block;
 color:#555;
 font-size:9px;
 letter-spacing:2px;
 margin-top:5px;
}
.admin-nav{display:flex;flex-direction:column;gap:4px}
.admin-tab{
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 color:#777;
 padding:12px;
 border-radius:11px;
 font-size:12px;
 transition:.2s;
}
.admin-tab:hover,.admin-tab.active{
 color:white;
 background:#151515;
}
.admin-close{
 margin-top:auto;
 border:1px solid var(--line);
 color:#777;
 background:#0d0d0d;
 padding:11px;
 border-radius:11px;
}
.admin-main{
 flex:1;
 min-width:0;
 overflow:auto;
}
.admin-top{
 position:sticky;
 top:0;
 z-index:5;
 height:70px;
 background:rgba(5,5,5,.88);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--line);
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:0 28px;
}
.admin-top h2{font-size:18px}
.admin-top span{font-size:11px;color:#555}
.admin-content{
 padding:30px;
 max-width:1400px;
}
.admin-section{display:none}
.admin-section.active{display:block}
.admin-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
 margin-bottom:25px;
}
.admin-stat{
 padding:20px;
 background:#0c0c0c;
 border:1px solid var(--line);
 border-radius:18px;
}
.admin-stat b{
 display:block;
 font-size:27px;
 margin-bottom:5px;
}
.admin-stat span{font-size:11px;color:#666}
.panel{
 border:1px solid var(--line);
 border-radius:20px;
 background:#0b0b0b;
 padding:22px;
 margin-bottom:20px;
}
.panel-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:18px;
}
.panel-title h3{font-size:16px}
.panel-title span{font-size:11px;color:#555}
.two{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}
.three{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
}
.admin-list{
 display:flex;
 flex-direction:column;
 gap:8px;
}
.admin-row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:13px;
 border:1px solid var(--line);
 background:#0e0e0e;
 border-radius:13px;
}
.admin-row-main{
 min-width:0;
 display:flex;
 align-items:center;
 gap:12px;
}
.admin-thumb{
 width:45px;
 height:45px;
 border-radius:10px;
 object-fit:cover;
 background:#191919;
}
.admin-row-main strong{font-size:12px}
.admin-row-main small{
 display:block;
 color:#666;
 margin-top:4px;
 font-size:10px;
}
.admin-actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 justify-content:flex-end;
}
.empty{
 text-align:center;
 padding:35px;
 color:#555;
 border:1px dashed #222;
 border-radius:15px;
}
.checkbox{
 display:flex;
 align-items:center;
 gap:8px;
 color:#999;
 font-size:12px;
 margin:10px 0;
}
.checkbox input{accent-color:white}
.file-preview{
 width:100%;
 height:150px;
 object-fit:cover;
 border-radius:14px;
 border:1px solid var(--line);
 margin-top:8px;
 display:none;
}
.color-row{
 display:flex;
 gap:10px;
 align-items:center;
}
.color-row input[type=color]{
 width:50px;
 height:40px;
 padding:2px;
}
.notice{
 padding:12px;
 border:1px solid #242424;
 background:#101010;
 color:#777;
 border-radius:12px;
 font-size:11px;
 line-height:1.6;
}

/* MODALS */
.modal{
 position:fixed;
 inset:0;
 z-index:100000;
 background:rgba(0,0,0,.78);
 backdrop-filter:blur(10px);
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.modal.open{display:flex}
.modal-box{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 border:1px solid #252525;
 border-radius:25px;
 background:#0b0b0b;
 padding:25px;
 box-shadow:0 30px 100px rgba(0,0,0,.7);
 animation:modalIn .25s ease;
}
.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}
.modal-head h3{font-size:19px}
.modal-x{
 border:0;
 background:#151515;
 color:#aaa;
 width:35px;
 height:35px;
 border-radius:10px;
}
.modal-actions{
 display:flex;
 justify-content:flex-end;
 gap:8px;
 margin-top:20px;
}
@keyframes modalIn{
 from{opacity:0;transform:scale(.94) translateY(15px)}
 to{opacity:1;transform:none}
}

/* REVEAL */
.reveal{
 opacity:0;
 transform:translateY(30px);
 transition:.8s ease;
}
.reveal.visible{
 opacity:1;
 transform:none;
}

/* TOAST */
#toast{
 position:fixed;
 right:20px;
 bottom:20px;
 z-index:200000;
 background:#fff;
 color:#000;
 padding:13px 17px;
 border-radius:12px;
 font-size:12px;
 font-weight:800;
 transform:translateY(100px);
 opacity:0;
 transition:.3s;
}
#toast.show{
 transform:none;
 opacity:1;
}

/* MOBILE */
@media(max-width:850px){
 header{height:65px;padding:0 4%}
 nav{
  position:absolute;
  top:65px;
  left:0;
  right:0;
  background:#080808;
  border-bottom:1px solid var(--line);
  padding:10px;
  display:none;
  flex-direction:column;
 }
 nav.open{display:flex}
 nav a{width:100%;text-align:center}
 .menu-btn{display:block}
 main{padding-top:65px}
 .section{padding:75px 5%}
 .hero{
  min-height:auto;
  grid-template-columns:1fr;
  padding-top:65px;
 }
 .hero h1{letter-spacing:-4px}
 .hero-card{min-height:330px}
 .about-grid,.review-list,.two{grid-template-columns:1fr}
 .stats-grid{grid-template-columns:1fr 1fr}
 .products-grid{grid-template-columns:1fr}
 .review-summary{grid-template-columns:1fr}
 .discord{padding:30px;flex-direction:column;align-items:flex-start}
 .admin-sidebar{
  position:absolute;
  left:-250px;
  top:0;
  bottom:0;
  z-index:10;
  transition:.3s;
 }
 #adminOverlay.sidebar-open .admin-sidebar{left:0}
 .admin-content{padding:20px 15px}
 .admin-top{padding:0 15px}
 .admin-menu{display:block!important}
 .admin-grid{grid-template-columns:1fr 1fr}
 .three{grid-template-columns:1fr}
}
.admin-menu{
 display:none;
 border:1px solid var(--line);
 background:#111;
 color:white;
 padding:8px 10px;
 border-radius:10px;
}

/* PRODUCT DETAIL */
.detail-img{
 width:100%;
 max-height:330px;
 object-fit:cover;
 border-radius:18px;
 margin-bottom:18px;
}
</style>
</head>

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<!-- BIENVENIDA -->
<div id="welcomeScreen">
 <div class="welcome-content">
  <div class="welcome-logo" id="welcomeLogo">L</div>
  <h1 id="welcomeTitle">Luna Market</h1>
  <p id="welcomeText">Haz clic en cualquier lugar para entrar</p>
 </div>
</div>

<header>
 <a href="#inicio" class="logo" id="brandName">Luna<span>Market</span></a>

 <nav id="mainNav">
  <a href="#inicio">Inicio</a>
  <a href="#sobre">Sobre nosotros</a>
  <a href="#estadisticas">Estadísticas</a>
  <a href="#productos">Productos</a>
  <a href="#resenas">Reseñas</a>
  <a href="#discord">Discord</a>
 </nav>

 <div style="display:flex;align-items:center">
  <button class="menu-btn" id="menuBtn">☰</button>
  <button class="admin-dot" id="adminBtn" title="Administración"></button>
 </div>
</header>
